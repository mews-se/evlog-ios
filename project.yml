name: EVLog
options:
  bundleIdPrefix: se.mews
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
# keeps Xcode's "update to recommended settings" triangle away - changes made in
# its dialog land in the generated project and are lost on the next xcodegen run
attributes:
  LastUpgradeCheck: "2710"
settings:
  base:
    DEVELOPMENT_TEAM: 4S9Z57Q8KR
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  EVLog:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/Demo
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "3.5"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: EVLog
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        CODE_SIGN_STYLE: Automatic
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: EVLog reads your car's data from your TeslaMate server on the local network.
